[5]
topic=驻防
info=驻防即是命令一队星际战士守卫、增援并确保行星安全的简单行为。
strategy=驻防在战术小队视图中进行，你可以在战团管理界面进入。你留下的任何驻军中最重要的人物都是其领袖——无论是连队的连长，还是行星上最有经验的中士。
main_info=当你的星际战士驻防于一颗行星时，他们作为帝国卫队的力量倍增器发挥作用，帮助卫队做出正确的战略抉择，同时与该行星的领导层建立忠诚纽带。为此，指派兼具魅力与智慧的连长或中士担任驻防指挥官是明智之举。拥有光荣特质的星际战士也是出色的驻防指挥官，只要他们的魅力同样说得过去。

[6]
topic=审判庭
info=审判庭是一个秘密组织，存在于人类帝国常规行政体系之外。他们是帝国的秘密警察力量。
strategy=当接到任务时，你应当接受以提升好感。审判庭也比其他帝国派系更有能力处理或使用混沌遗物。
main_info=由于审判庭既无正式等级也无领导层，每位审判官都得以按照自己认为最合适的方式追求人类生存的使命。志同道合者聚集在一起，在众多审判修会之一的界限内调查共同关心或担忧的领域。各修会随时代兴衰，因为许多审判官会根据自己判断的需求在各修会之间自由流动。恶魔活动越猖獗，恶魔修会(Ordo Malleus)就越大；异端横行之时，异端修会(Ordo Hereticus)也会壮大以应对威胁。一个修会可以沉寂多年，仅作为历史奇观存在，直到其研究领域再度变得重要。然而银河的本质就是如此——恶魔、异形与异端带来的某些危险永远存在。因此，专门对抗它们的修会——恶魔修会、异形修会与异端修会——被视为高等修会(Ordos Majoris)，因为它们的警戒永无止境。此外还有众多低等修会(Ordos Minoris)，它们是致力于应对更短暂危险的分支。
