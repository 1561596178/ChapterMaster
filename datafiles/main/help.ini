[2]
topic=遗物
info=遗物，又称圣物，是来自被遗忘时代的古代武器。它们通常工艺卓绝、威力强大，但也可能在漫长的岁月中被混沌玷污。
strategy=遗物一旦被探测到，即可通过将任何部队登陆到该行星来获取。它们可以装备给你的星际战士以增强其破坏力。另一些遗物无法使用，但会提供战团级别的加成。你也可以将遗物慷慨赠予其他派系——如果该遗物品相不差，这通常会提升关系与好感。请注意遗物是否沾染混沌，或者——愿帝皇保佑——是否被恶魔附身，因为这可能改变受赠派系的感激程度。
