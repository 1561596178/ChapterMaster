[11]
topic=STC
info=标准模板构造(STC)系统是科技黑暗时代创造的复杂分析与处理系统。据说它们包含了当时人类全部的技术知识。
strategy=如果在一颗行星上探测到 STC 碎片，你可以登陆技术军士或技术牧师以获取它。随后，你的战团可以鉴定这块 STC 碎片，尝试发掘被遗忘的技术秘密(可能获得战团级加成或新的装备选项)，或将其赠予其他派系以提升好感。
main_info=在帝国时代，仍在运作的 STC 几乎闻所未闻。回收 STC 的碎片或其中使用的模板是机械教求知之旅的首要目标，这项探索还包括寻找、整理和利用 STC 打印输出。STC 之于机械教，正如万智之泉之于世人(这正是它被设计成的样子)。从 STC 中发掘出的古老打印输出被视为神圣经文。机械教竭力从中恢复尽可能多的信息，希望能找到新的知识、武器与技术。尽管最先进的技术信息仍令机械教无法企及，但凭借他们的努力，许多信息已被恢复或通过比对副本重建。
related_1=遗物
related_2=机械教
