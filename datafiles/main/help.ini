[3]
topic=国教
info=人类帝国的官方国教，维护并宣扬对人类帝皇作为唯一真神的崇拜。
strategy=国教不容忍腐化，无论真实与否。
main_info=国教的精神与世俗权力核心是帝国圣礼，亦称帝国信条或帝国信仰。帝国圣礼的基础是对帝皇作为神明的信仰与崇拜、帝皇在精神与世俗事务中代求的力量、祈祷改变境遇的力量，以及人类统治星空的正当权利。国教部还在帝国全境管理与传播帝国信仰。虽然任何帝国的宗教教派最终都必须遵循帝国信条的核心神学，但相互冲突的解释使得帝国圣礼在实践中成为众多不同思想流派的聚合体。银河各处的教派在本质上一致，却常在特定信条或崇拜方式上各不相同。对许多人而言，帝皇是战神；对另一些人，他是救世主与光明使者；对某些人，他是死者的严正审判者。不可避免地，信仰侧重点的简单差异会成为敌意的源头，甚至引发流血。
