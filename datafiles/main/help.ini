[1]
topic=战斗修女会
info=又称战斗修女，是帝国国教中完全由女性组成的分支。她们是国教的武装力量。
strategy=战斗修女会不容忍任何腐化或异端，无论真实与否。如果你找到一件神圣遗物并将其赠予她们，她们会为它的归还而感激。
main_info=战斗修女是国教部(机械教主教区)军队的中坚。她们装备精良、训练达到帝国最高标准，专精于发动信仰战争并清剿任何地方的异端。因此，她们的职责常与审判庭的异端修会重叠，战斗修女也与女巫猎人保持着紧密的同盟。战斗修女会本身分为六个大修会，每个大修会拥有数万名战斗修女，另有众多小修会，各自也拥有数千名修女。这些部队很少全军出动，而是被派去发动信仰战争、协助审判庭，或保护国教的建筑、财产与遗物。只要可能，战斗修女都会使用神圣三连武器——爆弹枪、火焰枪与热熔枪。"Adepta Sororitas"与"Sisters of Battle"这两个词常被视为同义，但后者严格来说仅指战斗修会。
