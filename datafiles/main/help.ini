[4]
topic=灭绝令
info=灭绝令是帝国当局下达的可怕命令之名，旨在摧毁整颗行星的生物圈以及世界上的所有生命。
strategy=可从审判庭购买一种获得星际战士认可的简易灭绝令装置，然后将其装备到任意星际战士的"装备"栏位。若该星际战士袭击一颗行星并赢得战斗，装置将被消耗，将那颗行星变成死亡世界并杀死其上所有生命。
main_info=灭绝令是帝国武库中的诸多手段之一，用于那些被认为彻底毁灭比更隐秘或常规的手段更好的情况。目标世界可能已堕入混沌崇拜，或帝国政府被基因窃取者等异形取代，也可能是一个窝藏着极其强大危险异形物种的非帝国世界。当世界被认为不值得耗费征服或收复所需的兵力和物资时，人们常诉诸灭绝令。灭绝令极少用于对帝国至关重要或有价值的行星。它也曾被用作断绝异形入侵资源的办法。任何审判官、星际战士战团长、海军大元帅或最高指挥官均可下达灭绝令。帝国海军通常诉诸大规模轰击，星际战士则倾向于在地表安放炸弹，而审判庭拥有病毒炸弹与旋风鱼雷等更奇异的武器。
