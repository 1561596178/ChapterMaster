[7]
topic=星际战士成长
info=人不是一成不变的。星际战士和各种雇佣者都会随着经验的积累提升核心属性。
strategy=大多数人每获得 15 点经验就在某一项属性上 +1。提升哪项属性取决于他们的身份。星际战士主要提升射击与近战技能，而专家往往在与其职责相关的方面成长。例如，技术军士提升科技，牧师则提升魅力。

[8]
topic=任务
info=尽管阿斯塔特修会独立自主，其他派系有时也会请求一个战团执行他们自己无力完成的艰巨任务。
strategy=为其他派系完成任务有机会提升该派系的好感，偶尔还会带来其他额外奖励。实际任务多种多样，但几乎都可以通过袭击、进攻、清剿或在该世界登陆几名星际战士来完成。有疑问时请仔细阅读任务弹窗并查看事件日志条目。

[9]
topic=等离子炸弹
info=等离子炸弹是一种破坏性的爆炸武器，用于摧毁行星设施或舰船。
strategy=等离子炸弹可以在军械库中制造，然后装备到任意星际战士的"装备"栏位。如果他们在地面战斗中获胜，敌方行星设施将被摧毁或停用。它们同样可用于登舰作战——如果你的星际战士参与登舰并携带等离子炸弹，他们将根据你在"战团设置"中的选择执行相应任务。
main_info=等离子炸弹是一种等离子武器，设计用于帝国星鹰轰炸机在虚空战中攻击敌方主力舰。当星鹰贴近星舰船体进行轰炸时，常从其舱中部的炸弹发射筒抛下一连串等离子弹头。然而，更大型的等离子炸弹也曾在行星上被投下或安放，通常作为轨道轰炸或灭绝令行动的一部分。

[10]
topic=斯派尔猎人
info=斯派尔猎人(Spyre Hunters)是来自蜂巢世界尼科蒙达及其他类似行星的高等贵族中的一支亚群体。
strategy=这些男男女女武装到牙齿、铠甲精良且凶残至极，但终究是血肉之躯。若遭遇压倒性的敌人数目，他们会运用潜行。
main_info=在蜂巢城市的工业地下蜂巢中，统治家族的帮派为稀缺资源相互争夺，上层贵族也派出他们自己的"帮派"加入地下冲突，目的却截然不同。斯派尔猎人团体由贵族家族中未经考验的年轻人组成，他们生于蜂巢上层，几乎不知匮乏与艰辛。这些团体随后深入下层，履行赞助者族长或女族长强加于他们的誓言——要么在无依无靠的地下城深处生存指定时长，要么取得指定数量的击杀。任务完成前他们不得返回。通过这种方式，贵族家族中未经考验的个体将证明自己冷酷无情、足智多谋，从而适合领导角色。偶尔，有些人会如此迷恋狩猎，以至于作为其他斯派尔狩猎的一员重返地下蜂巢，或以族长、女族长的身份赞助后来的团体。每名斯派尔猎人都获赠一套独特的狩猎装备，由境外以近乎失传的技术打造。
